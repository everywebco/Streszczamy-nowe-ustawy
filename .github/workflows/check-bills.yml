# Raz w tygodniu (w niedzielę) sprawdza w API Sejmu, czy pojawiły się nowe ustawy przekazane Prezydentowi do podpisu
# oraz czy zmienił się status ustaw już śledzonych. Gdy coś się zmieni:
#   1) zapisuje zmiany w content/ustawy/*.md (commit do repozytorium),
#   2) uruchamia osobny pipeline "Streszczenia AI" (summarize-bills.yml) dla ustaw bez aktualnego streszczenia,
#   3) uruchamia publikację strony (deploy.yml).
name: Sprawdzanie ustaw

on:
  schedule:
    # w każdą niedzielę o 5:23 UTC (6:23 czasu zimowego / 7:23 letniego w Polsce)
    - cron: "23 5 * * 0"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Ile dni wstecz przeszukać zmiany w API Sejmu"
        required: false
        default: "30"

permissions:
  contents: write # commit zmian w plikach ustaw
  actions: write # uruchamianie kolejnych workflowów (gh workflow run)

concurrency:
  group: check-bills
  cancel-in-progress: false

jobs:
  check:
    name: Sprawdź ustawy w API Sejmu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sprawdź nowe ustawy i zmiany statusu
        id: check
        run: node scripts/check-bills.ts
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '30' }}

      - name: Zapisz zmiany w repozytorium
        id: commit
        if: steps.check.outputs.changed == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.check.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ustawy
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Nie udało się wypchnąć zmian do repozytorium."
          exit 1

      - name: Uruchom pipeline "Streszczenia AI"
        if: steps.check.outputs.ai_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          AI_IDS: ${{ steps.check.outputs.ai_ids }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::Brak sekretu CLAUDE_CODE_OAUTH_TOKEN (token subskrypcji z 'claude setup-token') – pomijam generowanie streszczeń."
            exit 0
          fi
          gh workflow run summarize-bills.yml --ref "$GITHUB_REF_NAME" -f bill_ids="$AI_IDS"

      - name: Uruchom publikację strony
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
